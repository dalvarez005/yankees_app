# Sirve la versión web (PWA) de la app. Cloudflare pone el HTTPS delante.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 1024;

    # Los archivos de Flutter no llevan hash en el nombre: siempre se revalidan
    # (con ETag), así una versión nueva llega al recargar.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Motor gráfico, fuentes, íconos y logo cambian poco: el navegador los
    # guarda 30 días (el service worker igual los revisa en segundo plano).
    location ~ ^/(canvaskit|assets|icons)/ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # El service worker siempre se pide de nuevo para detectar versiones nuevas.
    location = /firebase-messaging-sw.js {
        add_header Cache-Control "no-cache, no-store" always;
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
