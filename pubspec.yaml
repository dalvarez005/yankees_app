name: yankees
description: "Gestión de pagos del club Yankees"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  exif: ^3.3.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter:
    sdk: flutter
  # Web: sin historial del navegador (ver main.dart).
  flutter_web_plugins:
    sdk: flutter
  flutter_image_compress: ^2.5.1
  flutter_local_notifications: ^22.3.1
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  google_fonts: ^8.2.1
  google_mlkit_text_recognition: ^0.17.1
  google_sign_in: ^7.2.0
  # Botón de Google propio de la versión web (renderButton).
  google_sign_in_web: ^1.1.3
  # renderButton en un elemento propio (botón transparente sobre el nuestro).
  google_identity_services_web: ^0.3.3
  # APIs del navegador (solo en código web).
  web: ^1.1.1
  http: ^1.6.0
  image_picker: ^1.2.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/branding/logo.png
    # google_fonts usa estas en vez de descargarlas (licencia: assets/fonts/OFL.txt).
    - assets/fonts/Poppins-Regular.ttf
    - assets/fonts/Poppins-Medium.ttf
    - assets/fonts/Poppins-SemiBold.ttf
    - assets/fonts/Poppins-Bold.ttf
    - assets/fonts/OFL.txt
