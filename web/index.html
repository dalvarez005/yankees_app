<!DOCTYPE html>
<html lang="es">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Hijos, cuotas y comprobantes de pago del Club Yankees.">
  <meta name="theme-color" content="#0C2340">

  <!-- iPhone: "Compartir > Agregar a inicio" la abre a pantalla completa. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Yankees">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Club Yankees</title>
  <link rel="manifest" href="manifest.json">
  <!-- Abre la conexión con la API mientras carga la app. -->
  <link rel="preconnect" href="https://yankeesapi.quantis.site" crossorigin>
  <style>
    /* Pantalla de carga mientras arranca la app. */
    html, body { margin: 0; height: 100%; background: #0C2340; }
    #splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    #splash img { width: 120px; height: 120px; border-radius: 28px; background: #fff; padding: 8px; }
  </style>
</head>
<body>
  <div id="splash"><img src="icons/Icon-192.png" alt="Club Yankees"></div>
  <script>
    // Se quita el logo de carga cuando Flutter dibuja la primera pantalla.
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) s.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
